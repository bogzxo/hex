# Pushing a tag that starts with v (v0.4.0), Hex published for Windows, Linux and macOS and the packages put on a
# GitHub release of that name. Windows Setup is a self-extracting EXE. A native compiler only builds for its own
# system. Not on every push to master as well: a release pushes master and then its tag, and the same commit was built
# twice, once for nothing. Run by hand (Actions, Build, Run workflow) for a build without a release.

name: Build

on:
  workflow_dispatch:
  push:
    tags: [ "v*" ]
  # The nightly build (nightly.yml) runs the same build on the development branch, as the dev channel
  workflow_call:
    inputs:
      ref:
        description: The commit to build, the event's own when empty
        type: string
        default: ""
      channel:
        description: stable or dev, said into the build so it updates from its own kind of release
        type: string
        default: ""
      nightly:
        description: The nightly release the build goes out as, nightly- and the run
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          # Apple's classic linker turns down an unaligned pointer in .NET's own System.Net.Security.Native on Intel,
          # the newer one only warns about it
          - os: macos-15-intel
            rid: osx-x64
            publish_args: -p:UseLdClassicXCodeLinker=false
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-11-arm
            rid: win-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit the nightly build asked for, the event's own otherwise
          ref: ${{ inputs.ref }}
          # The extensions (bogzxo/hex-extensions at hex-extensions)
          submodules: recursive
          # The history too, for a nightly's build number, the commits since the last release's
          fetch-depth: 0

      # The engine on development, and the language inside of it
      - uses: actions/checkout@v4
        with:
          repository: bogzxo/horizon
          ref: development
          path: horizon
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Native compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Cache packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = ($props.Project.PropertyGroup | Where-Object { $_.Version }).Version
          if ($env:GITHUB_REF_NAME.Substring(1) -ne $version) { throw "Release tag must match Directory.Build.props ($version)." }

      # The build number of the build the release was made from (.hex-build-release, see Hex/HexBuildNumber.targets), a
      # nightly that number and one more for every commit since, rather than counting from nothing on a fresh checkout
      - name: Build number
        shell: bash
        run: |
          n=$(tr -d '[:space:]' < .hex-build-release 2>/dev/null || true)
          if [ -n "$n" ] && [ -n "${{ inputs.nightly }}" ]; then
            since=$(git log -1 --format=%H -- .hex-build-release 2>/dev/null || true)
            if [ -n "$since" ]; then n=$((n + $(git rev-list --count "$since"..HEAD 2>/dev/null || echo 0))); fi
          fi
          echo "HEX_BUILD_FIXED=$n" >> "$GITHUB_ENV"
          echo "Hex build ${n:-counted}"

      - name: Publish
        run: dotnet publish Hex/Hex.csproj --configuration Release --runtime ${{ matrix.rid }} --output publish/Hex ${{ matrix.publish_args }} "-p:HexChannel=${{ inputs.channel }}" "-p:HexNightly=${{ inputs.nightly }}" "-p:HexBuildFixed=${{ env.HEX_BUILD_FIXED }}"

      - name: Publish installer
        run: dotnet publish Hex.Installer/Hex.Installer.csproj --configuration Release --runtime ${{ matrix.rid }} --output publish/Hex.Setup ${{ matrix.publish_args }} "-p:HexChannel=${{ inputs.channel }}" "-p:HexNightly=${{ inputs.nightly }}"

      - name: Verify standalone setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($exe in @('publish/Hex/Hex.exe', 'publish/Hex.Setup/Hex.Installer.exe')) {
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $exe))
            $pe = [BitConverter]::ToInt32($bytes, 0x3c)
            $subsystem = [BitConverter]::ToUInt16($bytes, $pe + 24 + 68)
            if ($subsystem -ne 2) { throw "$exe must use the Windows GUI subsystem, not open a console." }
          }
          $files = @(Get-ChildItem -LiteralPath publish/Hex.Setup -Recurse -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'Hex.Installer.exe') { throw 'Windows setup must publish as one EXE.' }
          # Invalid arguments exit before graphics or any installation, exercising extraction and failure cleanup.
          $setup = Start-Process -FilePath $files[0].FullName -ArgumentList '--invalid-option' -PassThru -Wait -WindowStyle Hidden
          if ($setup.ExitCode -ne 1) { throw 'Standalone setup did not forward its exit status.' }
          if (@(Get-ChildItem -LiteralPath publish/Hex.Setup -Directory).Count -ne 0) { throw 'Setup left its extraction folder behind.' }

      - name: macOS icon
        if: runner.os == 'macOS'
        run: |
          mkdir -p publish/hex.iconset
          # The nightly build's own, grey with a yellow H
          icon=Hex.Shell/Assets/hex_icon.png
          if [ "${{ inputs.channel }}" = "dev" ]; then icon=Hex.Shell/Assets/hex_icon_dev.png; fi
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" "$icon" --out "publish/hex.iconset/icon_${size}x${size}.png"
            double=$((size * 2))
            sips -z "$double" "$double" "$icon" --out "publish/hex.iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns publish/hex.iconset -o publish/Hex/Assets/hex_icon.icns
          cp publish/Hex/Assets/hex_icon.icns publish/Hex.Setup/Assets/hex_icon.icns

      - name: Bundle updater and prepare setup
        shell: pwsh
        run: |
          Copy-Item -LiteralPath publish/Hex.Setup -Destination publish/Hex/installer -Recurse
          if ('${{ runner.os }}' -eq 'macOS') {
            New-Item -ItemType Directory -Path 'publish/Hex Setup.app/Contents' -Force
            Move-Item -LiteralPath publish/Hex.Setup -Destination 'publish/Hex Setup.app/Contents/MacOS'
            New-Item -ItemType Directory -Path 'publish/Hex Setup.app/Contents/Resources' -Force
            Copy-Item -LiteralPath 'publish/Hex Setup.app/Contents/MacOS/Assets/hex_icon.icns' -Destination 'publish/Hex Setup.app/Contents/Resources/hex.icns'
            @'
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict><key>CFBundleExecutable</key><string>Hex.Installer</string><key>CFBundleIdentifier</key><string>com.bogzxo.hex.setup</string><key>CFBundleName</key><string>Hex Setup</string><key>CFBundlePackageType</key><string>APPL</string><key>CFBundleIconFile</key><string>hex.icns</string><key>NSHighResolutionCapable</key><true/></dict></plist>
          '@ | Set-Content -LiteralPath 'publish/Hex Setup.app/Contents/Info.plist'
          }

      - name: Zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path publish/Hex -DestinationPath Hex-${{ matrix.rid }}.zip
          Copy-Item -LiteralPath publish/Hex.Setup/Hex.Installer.exe -Destination Hex-Setup-${{ matrix.rid }}.exe

      - name: Zip
        if: runner.os != 'Windows'
        working-directory: publish
        run: |
          zip -r ../Hex-${{ matrix.rid }}.zip Hex
          if [ "${{ runner.os }}" = "macOS" ]; then
            zip -r ../Hex-Setup-${{ matrix.rid }}.zip 'Hex Setup.app'
          else
            zip -r ../Hex-Setup-${{ matrix.rid }}.zip Hex.Setup
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Hex-${{ matrix.rid }}
          path: |
            Hex-${{ matrix.rid }}.zip
            Hex-Setup-${{ matrix.rid }}.zip
            Hex-Setup-${{ matrix.rid }}.exe

  # Hex.app, the macOS application bundle, as a .dmg and a .zip (scripts/macos/make-app.sh, docs/macos-app.md). Signed with
  # a Developer ID and notarized when the repository has the secrets for it (MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD,
  # MACOS_TEAM_ID, MACOS_NOTARY_KEY_BASE64, MACOS_NOTARY_KEY_ID, MACOS_NOTARY_ISSUER), ad hoc signed without them, which
  # a Mac only opens for the person who built it, and the job summary says which it was.
  macos-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: bogzxo/horizon
          ref: development
          path: horizon
          submodules: recursive

      # The SDK the other jobs use (11.0.x preview), global.json pins none
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Cache packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: macos-app-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            macos-app-nuget-

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' Directory.Build.props | head -n 1)"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then echo "Release tag must match Directory.Build.props ($version)." >&2; exit 1; fi

      # Same number as the other jobs, see Build number above
      - name: Build number
        run: |
          n=$(tr -d '[:space:]' < .hex-build-release 2>/dev/null || true)
          if [ -n "$n" ] && [ -n "${{ inputs.nightly }}" ]; then
            since=$(git log -1 --format=%H -- .hex-build-release 2>/dev/null || true)
            if [ -n "$since" ]; then n=$((n + $(git rev-list --count "$since"..HEAD 2>/dev/null || echo 0))); fi
          fi
          echo "HEX_BUILD_FIXED=$n" >> "$GITHUB_ENV"

      # The certificate in a keychain of its own that goes with the job, and the notary service's API key
      - name: Signing
        id: signing
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          if [ -z "$CERT_P12" ] || [ -z "$CERT_PASSWORD" ] || [ -z "$TEAM_ID" ]; then
            echo "identity=-" >> "$GITHUB_OUTPUT"
            echo "No Developer ID certificate in the secrets, the app is ad hoc signed."
            exit 0
          fi
          keychain="$RUNNER_TEMP/hex-signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/hex-cert.p12"
          security import "$RUNNER_TEMP/hex-cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/hex-cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application" | grep "($TEAM_ID)" | head -n 1 | awk '{print $2}')"
          if [ -z "$identity" ]; then echo "No Developer ID Application identity for team $TEAM_ID in the certificate." >&2; exit 1; fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          if [ -n "$NOTARY_KEY" ] && [ -n "$NOTARY_KEY_ID" ] && [ -n "$NOTARY_ISSUER" ]; then
            echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/hex-notary.p8"
            echo "notary_key=$RUNNER_TEMP/hex-notary.p8" >> "$GITHUB_OUTPUT"
          fi

      - name: Make Hex.app
        env:
          IDENTITY: ${{ steps.signing.outputs.identity }}
          NOTARY_KEY_FILE: ${{ steps.signing.outputs.notary_key }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          args=(--arch arm64 --zip --dmg --out artifacts/macos --identity "$IDENTITY")
          if [ -n "$NOTARY_KEY_FILE" ]; then args+=(--notary-key "$NOTARY_KEY_FILE" --notary-key-id "$NOTARY_KEY_ID" --notary-issuer "$NOTARY_ISSUER"); fi
          if [ -n "${{ inputs.channel }}" ]; then args+=(--channel "${{ inputs.channel }}"); fi
          scripts/macos/make-app.sh "${args[@]}" -- "-p:HexNightly=${{ inputs.nightly }}" "-p:HexBuildFixed=${{ env.HEX_BUILD_FIXED }}"

      - name: Check the app
        run: |
          app=artifacts/macos/Hex.app
          codesign --verify --deep --strict --verbose=2 "$app"
          if [ "${{ steps.signing.outputs.identity }}" = "-" ]; then
            {
              echo "### Hex.app is ad hoc signed"
              echo "No Developer ID certificate is in this repository's secrets, so macOS will not open this app after it is downloaded without Open Anyway in System Settings. See docs/macos-app.md."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            spctl --assess --type execute --verbose=2 "$app"
            xcrun stapler validate "$app" || echo "::warning::The app has no notarization ticket stapled."
            echo "### Hex.app is signed with Developer ID ${{ steps.signing.outputs.identity }}" >> "$GITHUB_STEP_SUMMARY"
          fi

      # What the other jobs' packages are called, Hex-<version>-macos-arm64 here, the .dmg and the .zip
      - uses: actions/upload-artifact@v4
        with:
          name: Hex-macos-arm64-app
          path: |
            artifacts/macos/Hex-*-macos-arm64.dmg
            artifacts/macos/Hex-*-macos-arm64.zip

      - name: Forget the keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/hex-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/hex-notary.p8"

  # TODO (off): an Intel build of the app. macos-15-intel with `--arch x64` and `-- -p:UseLdClassicXCodeLinker=false` (the
  # reason build's matrix says), or `--arch universal` on one runner, were not tried, and the files would be named
  # Hex-<version>-macos-x64 and -macos-universal. Add them here when one has been run.

  release:
    # The macOS app is new and its job hasn't a release behind it yet: when it fails the release still goes out with
    # the Windows and Linux builds, and says so, rather than nobody getting anything
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success' }}
    needs: [build, macos-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Starting Pages again once the release is out
      actions: write
    steps:
      # RELEASE_NOTES.md is what the release says
      - uses: actions/checkout@v4
        with:
          sparse-checkout: RELEASE_NOTES.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag with a dash in it (v1.6.0-rc.1), or notes whose title says preview, go out as a prerelease, which the
        # update check and GitHub's latest leave alone. The release is titled the way the notes are (Hex 2.8.0 thickboy),
        # which is where the installer and the update check get what the release is called
        run: |
          title="$(head -n 1 RELEASE_NOTES.md | sed 's/^#* *//')"
          case "$title" in "Hex ${GITHUB_REF_NAME#v}"*) ;; *) title="Hex $GITHUB_REF_NAME" ;; esac
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          if head -n 1 RELEASE_NOTES.md | grep -qi 'preview\|prerelease'; then prerelease="--prerelease"; fi
          shopt -s nullglob
          files=(dist/*.zip dist/*.exe dist/*.dmg)
          if ! compgen -G "dist/*.dmg" > /dev/null; then echo "::warning::No macOS app in this release, its job didn't make one."; fi
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file RELEASE_NOTES.md $prerelease
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      # The page says the latest release's version, codename and notes. A release made with the workflow's own token
      # doesn't start other workflows, but asking for one by hand does. A prerelease isn't the latest, nothing to say
      - name: Page
        if: steps.release.outputs.prerelease == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref master || echo "::warning::Pages didn't start; run it by hand so the page says the release."
