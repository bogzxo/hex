# Every push to master, Hex published for Windows, Linux and macOS, a zip for each kept with the run (Actions, the
# run, Artifacts). A native compiler only builds for the system it runs on, so each platform is built on its own.
# Pushing a tag that starts with v (v0.4.0) builds the same and puts the zips on a GitHub release of that name.

name: Build

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          # Apple's classic linker turns down an unaligned pointer in .NET's own System.Net.Security.Native on Intel,
          # the newer one only warns about it
          - os: macos-15-intel
            rid: osx-x64
            publish_args: -p:UseLdClassicXCodeLinker=false
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-11-arm
            rid: win-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The extensions (bogzxo/hex-extensions at hex-extensions)
          submodules: recursive

      # The engine as it is on its development right now, and the language inside of it
      - uses: actions/checkout@v4
        with:
          repository: bogzxo/horizon
          ref: development
          path: horizon
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Native compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Cache packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = ($props.Project.PropertyGroup | Where-Object { $_.Version }).Version
          if ($env:GITHUB_REF_NAME.Substring(1) -ne $version) { throw "Release tag must match Directory.Build.props ($version)." }

      - name: Publish
        run: dotnet publish Hex/Hex.csproj --configuration Release --runtime ${{ matrix.rid }} --output publish/Hex ${{ matrix.publish_args }}

      - name: Publish installer
        run: dotnet publish Hex.Installer/Hex.Installer.csproj --configuration Release --runtime ${{ matrix.rid }} --output publish/Hex.Setup ${{ matrix.publish_args }}

      - name: macOS icon
        if: runner.os == 'macOS'
        run: |
          mkdir -p publish/hex.iconset
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" Hex.Shell/Assets/hex_icon.png --out "publish/hex.iconset/icon_${size}x${size}.png"
            double=$((size * 2))
            sips -z "$double" "$double" Hex.Shell/Assets/hex_icon.png --out "publish/hex.iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns publish/hex.iconset -o publish/Hex/Assets/hex_icon.icns
          cp publish/Hex/Assets/hex_icon.icns publish/Hex.Setup/Assets/hex_icon.icns

      - name: Bundle updater and prepare setup
        shell: pwsh
        run: |
          Copy-Item -LiteralPath publish/Hex.Setup -Destination publish/Hex/installer -Recurse
          if ('${{ runner.os }}' -eq 'macOS') {
            New-Item -ItemType Directory -Path 'publish/Hex Setup.app/Contents' -Force
            Move-Item -LiteralPath publish/Hex.Setup -Destination 'publish/Hex Setup.app/Contents/MacOS'
            New-Item -ItemType Directory -Path 'publish/Hex Setup.app/Contents/Resources' -Force
            Copy-Item -LiteralPath 'publish/Hex Setup.app/Contents/MacOS/Assets/hex_icon.icns' -Destination 'publish/Hex Setup.app/Contents/Resources/hex.icns'
            @'
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict><key>CFBundleExecutable</key><string>Hex.Installer</string><key>CFBundleIdentifier</key><string>com.bogzxo.hex.setup</string><key>CFBundleName</key><string>Hex Setup</string><key>CFBundlePackageType</key><string>APPL</string><key>CFBundleIconFile</key><string>hex.icns</string><key>NSHighResolutionCapable</key><true/></dict></plist>
          '@ | Set-Content -LiteralPath 'publish/Hex Setup.app/Contents/Info.plist'
          }

      - name: Zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path publish/Hex -DestinationPath Hex-${{ matrix.rid }}.zip
          Compress-Archive -Path publish/Hex.Setup -DestinationPath Hex-Setup-${{ matrix.rid }}.zip

      - name: Zip
        if: runner.os != 'Windows'
        working-directory: publish
        run: |
          zip -r ../Hex-${{ matrix.rid }}.zip Hex
          if [ "${{ runner.os }}" = "macOS" ]; then
            zip -r ../Hex-Setup-${{ matrix.rid }}.zip 'Hex Setup.app'
          else
            zip -r ../Hex-Setup-${{ matrix.rid }}.zip Hex.Setup
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Hex-${{ matrix.rid }}
          path: |
            Hex-${{ matrix.rid }}.zip
            Hex-Setup-${{ matrix.rid }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      # RELEASE_NOTES.md is what the release says, GitHub's list of what changed goes under it
      - uses: actions/checkout@v4
        with:
          sparse-checkout: RELEASE_NOTES.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag with a dash in it (v1.6.0-rc.1), or notes whose title says preview, go out as a prerelease, which the
        # update check and GitHub's latest leave alone
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          if head -n 1 RELEASE_NOTES.md | grep -qi 'preview\|prerelease'; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --title "Hex $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --generate-notes $prerelease
