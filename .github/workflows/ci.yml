# Every push and pull request, Hex built against the engine it has as a submodule and its unit tests run, on Windows,
# Linux and macOS. The self tests want a window and a Vulkan device, so they aren't run here.

name: CI

on:
  workflow_dispatch:
  push:
    branches: [ "master", "development" ]
  pull_request:
    branches: [ "master", "development" ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The engine (bogzxo/horizon at horizon) and the language inside of it
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Cache packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build
        run: dotnet build Hex/Hex.csproj --configuration Release

      - name: Build installer
        run: dotnet build Hex.Installer/Hex.Installer.csproj --configuration Release

      - name: Test installer transactions
        run: dotnet test Hex.Installer.Tests --configuration Release --verbosity normal

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install engineering notebook test dependencies
        run: python -m pip install -r Hex.Tests/engineering-requirements.txt

      - name: Test
        run: dotnet test Hex.Tests --configuration Release --verbosity normal --blame-hang-timeout 5m --blame-hang-dump-type none

      # A run that hung or fell over keeps the blame's sequence file, the last test in it is the one that never ended
      - name: Keep what the tests left
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: Hex.Tests/TestResults/
          if-no-files-found: ignore
