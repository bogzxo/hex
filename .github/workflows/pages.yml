# Hex's page, https://bogzxo.github.io/hex/. The site folder as it is, there's nothing to build. Published when the
# stable branch's site changes, or by hand from any branch. Pages has to be switched on for the repository first,
# Settings, Pages, Source: GitHub Actions.

name: Pages

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths: [ 'site/**', '.github/workflows/pages.yml' ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
