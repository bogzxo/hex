<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Hex warm launch time, Windows x64 native build</title>
  <desc id="desc">Ten launches each after one discarded warmup per mode. Dawn median 453 milliseconds, range 434 to 478. Dusk median 320 milliseconds, range 298 to 326. Bars start at zero. Whiskers show the minimum and maximum.</desc>
  <rect width="1000" height="300" rx="16" fill="#18171f"/>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" fill="#ece9f2">
    <text x="32" y="40" font-size="22" font-weight="600">A fresh process, to the first frame of the scene.</text>
    <text x="32" y="66" font-size="14" fill="#a6a0b5">Process start → first scene · Hex 3.5.0 · Windows x64 · shader caches populated</text>
    <g stroke="#2c2a38" stroke-width="1">
      <path d="M160 92V224 M310 92V224 M460 92V224 M610 92V224 M760 92V224"/>
    </g>
    <text x="32" y="131" font-size="18">Dawn</text>
    <rect x="160" y="104" width="453" height="40" rx="6" fill="#da854d"/>
    <text x="32" y="200" font-size="18">Dusk</text>
    <rect x="160" y="173" width="320" height="40" rx="6" fill="#a99bff"/>
    <g stroke="#ffffff" stroke-width="2">
      <path d="M594 124H638 M594 116V132 M638 116V132 M458 193H486 M458 185V201 M486 185V201"/>
    </g>
    <text x="800" y="124" font-size="20" font-weight="600">453 ms</text>
    <text x="800" y="145" font-size="13" fill="#a6a0b5">434–478 ms</text>
    <text x="800" y="193" font-size="20" font-weight="600">320 ms</text>
    <text x="800" y="214" font-size="13" fill="#a6a0b5">298–326 ms</text>
    <g font-size="13" fill="#a6a0b5" text-anchor="middle">
      <text x="160" y="244">0</text><text x="310" y="244">150</text><text x="460" y="244">300</text><text x="610" y="244">450</text><text x="760" y="244">600 ms</text>
    </g>
    <text x="32" y="280" font-size="13" fill="#a6a0b5">Median of 10 launches per mode. Whiskers: min–max. One initial launch per mode discarded.</text>
  </g>
</svg>
